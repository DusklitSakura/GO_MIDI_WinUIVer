name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # publish.ps1 produces the same self-contained, unpackaged ZIP that a local
      # run does, so CI and a developer machine cannot drift apart.
      - name: Build portable package
        shell: pwsh
        run: ./publish.ps1 -Platform x64 -OutputRoot ./dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GO_MIDI-WinUI-x64
          path: dist/GO_MIDI-WinUI-x64.zip
          if-no-files-found: error

      # overwrite_files defaults to true, so attaching the ZIP by hand as well
      # does not make this step fail with "already_exists".
      - name: Attach ZIP to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/GO_MIDI-WinUI-x64.zip
          generate_release_notes: true